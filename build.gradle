plugins {
    id 'java-library'
    id "io.freefair.lombok" version "6.6.3"
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'maven-publish'
    id 'io.github.gradle-nexus.publish-plugin' version '1.1.0'
    id 'signing'
    id 'org.owasp.dependencycheck' version '13.0.0'
}


sourceCompatibility = 17
targetCompatibility = 17

repositories {
    mavenCentral()
}

java {
    withSourcesJar()
    withJavadocJar()
}

import java.nio.file.Paths

def readVersion() {
    def versionPropsFile = file(Paths.get("src","main","resources","version.properties"))
    if (versionPropsFile.canRead()) {
        Properties versionProps = new Properties()

        if (versionPropsFile.canRead()) {
            InputStream inputStream = new FileInputStream(versionPropsFile)
            versionProps.load(inputStream)
            inputStream.close()
        }
        versionProps['version']
    } else {
        throw new GradleException("Could not read version.properties!")
    }
}

version = readVersion()
group "software.amazon.msk"

// netty-nio-client is the SDK's asynchronous HTTP client. This library constructs
// only synchronous clients, so it is never instantiated. Several SDK service
// modules declare it transitively (sso, ssooidc and sts all do), so the exclusion
// has to be configuration-wide to take effect. Remove this if an asynchronous SDK
// client is ever introduced here.
// apache-client (the HttpClient 4.x implementation) is excluded so the classpath
// can never carry two synchronous SdkHttpService implementations: at the current
// BOM the service modules bring apache5-client, but an older or partially reverted
// BOM would reintroduce apache-client transitively alongside it.
configurations.all {
    exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    exclude group: 'software.amazon.awssdk', module: 'apache-client'
}

dependencies {
    compileOnly('org.apache.kafka:kafka-clients:2.8.1')
    // aws sdk imports.
    implementation(platform('software.amazon.awssdk:bom:2.51.2'))
    implementation('software.amazon.awssdk:auth')
    implementation('software.amazon.awssdk:regions')
    implementation('software.amazon.awssdk:sso')
    implementation('software.amazon.awssdk:ssooidc')
    implementation('software.amazon.awssdk:sts')
    implementation('com.fasterxml.jackson.core:jackson-databind:2.22.1')
    implementation('org.slf4j:slf4j-api:1.7.36')

    runtimeOnly('software.amazon.awssdk:apache5-client')

    // Declared as a real dependency (not only a constraint) so the 5.6.4 floor lands
    // in the published POM's <dependencies> and binds for Maven consumers of the thin
    // jar: Maven does not honour a transitive POM's <dependencyManagement> deeper in
    // the graph, so a constraint alone covers only Gradle consumers and the uber jar.
    runtimeOnly('org.apache.httpcomponents.client5:httpclient5:5.6.4')

    // The SDK's BOM currently resolves httpclient5 below the 5.6.4 floor. The
    // constraint keeps Gradle's resolution aligned with the declaration above.
    constraints {
        implementation('org.apache.httpcomponents.client5:httpclient5:5.6.4') {
            because 'CVE-2026-64607 and CVE-2026-71290 are fixed in 5.6.4'
        }
    }

    //test dependencies
    testImplementation('org.apache.kafka:kafka-clients:2.2.1')
    testImplementation('org.junit.jupiter:junit-jupiter-api:5.7.0')
    testImplementation('org.apache.commons:commons-lang3:3.11')
    testImplementation('org.mockito:mockito-inline:5.0.0')

    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.7.0')
    testRuntimeOnly('org.apache.logging.log4j:log4j-core:2.17.1')
    testRuntimeOnly('org.apache.logging.log4j:log4j-slf4j-impl:2.17.1')
}


shadowJar {
    //We remove org.slf4j from the configuration as it gets included transitively by multiple dependencies and just
    //removing it from the configuration being shadowed is not sufficient.
    configurations = [project.configurations.runtimeClasspath.exclude([group: "org.slf4j", module: "slf4j-api"])]
    exclude 'META-INF/versions/17/', 'META-INF/versions/21/', 'META-INF/versions/22/'

    relocate 'com.fasterxml.jackson', 'aws_msk_iam_auth_shadow.com.fasterxml.jackson'
    relocate 'com.h2database', 'aws_msk_iam_auth_shadow.com.h2database'
}



test {
    useJUnitPlatform {
        excludeTags 'ignored'
    }
}

dependencyCheck {
    // The NVD API rejects an empty string as an invalid key, so only set apiKey when
    // a value is actually present. See the README for how to obtain and pass a key.
    nvd {
        def key = project.findProperty('nvdApiKey') ?: System.getenv('NVD_API_KEY')
        if (key) {
            apiKey = key
        }
    }
    formats = ['HTML', 'JSON']
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = "Amazon MSK Library for AWS Identity and Access Management"
                packaging = "jar"
                url = "https://docs.aws.amazon.com/msk/latest/developerguide/iam-access-control.html"
                description = "The Amazon MSK Library for AWS Identity and Access Management allows JVM based Apache " +
                        "Kafka clients to use AWS IAM for authentication and authorization against Amazon MSK " +
                        "clusters that have AWS IAM enabled as an authentication mechanism"
                scm {
                    url = "https://github.com/aws/aws-msk-iam-auth"
                    connection = "scm:git:https://github.com/aws/aws-msk-iam-auth.git"
                    developerConnection = "scm:git:git@github.com:aws/aws-msk-iam-auth.git"
                }
                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        id = "amazonwebservices"
                        organization = "Amazon Web Services"
                        organizationUrl = "https://aws.amazon.com"
                    }
                }
            }
        }
    }

    repositories {
        maven {
            name = "sonatype-staging-api"
            url "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
            credentials {
                username project.hasProperty('ossrhUsername') ? project.property('ossrhUsername') : ""
                password project.hasProperty('ossrhPassword') ? project.property('ossrhPassword') : ""
            }
        }
    }

}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            username = project.findProperty("ossrhUsername") ?: ""
            password = project.findProperty("ossrhPassword") ?: ""
        }
    }
}
signing {
    def signingKey = project.hasProperty('signingKey') ? project.property('signingKey') : ""
    def signingPassword = project.hasProperty('signingPassword') ? project.property('signingPassword') : ""
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.mavenJava
}
